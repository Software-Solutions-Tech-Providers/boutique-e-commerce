# nginx: raisfast CMS/ecommerce at /, legacy shopapi under /shopapi/
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;
    server_tokens off;

    # Legacy demo API (prefix is stripped: /shopapi/products -> /products)
    location /shopapi/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # raisfast OpenAI-compatible LLM gateway: streaming (SSE) responses must not
    # be buffered, or the playground hangs until the whole answer is generated.
    location /v1/ {
        proxy_pass http://127.0.0.1:9898;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # OAuth callback page uses an inline script (stores session, redirects to
    # /admin). raisfast's global CSP `script-src 'self'` blocks it, leaving the
    # page stuck at "Signing in...". Relax CSP for THIS endpoint only: inline
    # script + same-origin fetch. The page reflects no request input.
    location ~ ^/api/v1/auth/oauth/[a-z]+/callback$ {
        proxy_pass http://127.0.0.1:9898;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
    }

    # Admin UI extensions (login tenant field, Google button, tenant switcher)
    location /admin-ext/ {
        alias /data/raisfast/admin-ext/;
        add_header Cache-Control "no-cache" always;
    }

    # Admin SPA HTML: inject the extension script (same origin => allowed by
    # raisfast's CSP). Assets under /admin/assets are not HTML, so untouched.
    location /admin {
        proxy_pass http://127.0.0.1:9898;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html;
        sub_filter '</head>' '<script src="/admin-ext/ext.js" defer></script></head>';
        sub_filter_once on;
    }

    # raisfast: admin UI (/admin), API (/api/v1), storefront
    location / {
        proxy_pass http://127.0.0.1:9898;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
